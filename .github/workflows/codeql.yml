name: CodeQL

# Rust, JavaScript/TypeScript and the workflows themselves. Any alert fails the job.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql
      - name: Fail on any alert
        shell: bash
        run: |
          count=$(jq '[.runs[].results[]] | length' "$RUNNER_TEMP"/codeql/*.sarif | awk '{n += $1} END {print n + 0}')
          echo "CodeQL results: $count"
          if ((count > 0)); then
            jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              "$RUNNER_TEMP"/codeql/*.sarif
            exit 1
          fi
