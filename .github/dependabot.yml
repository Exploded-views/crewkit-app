# Update PRs for cargo, npm and the workflows' actions. The cooldown takes a release only once it
# is at least 2 days old, the same rule CI's outdated job applies.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
