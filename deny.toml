# cargo deny configuration for src-tauri/ (run: cargo deny --manifest-path src-tauri/Cargo.toml check).

[graph]
all-features = true

[advisories]
# Any vulnerability, unmaintained, unsound or yanked crate fails.
version = 2
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each ignore names the crate that pins the affected version. Re-check on every Tauri upgrade.
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 (Linux only), pinned by tauri, wry and tray-icon through gtk 0.18; the fix needs glib 0.20, which Tauri 2's gtk3 stack cannot take" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained, build-time only, Linux only), pinned by gtk3-macros 0.18 through tauri's gtk 0.18" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Each exception names the crate that pulls it in. MPL-2.0 is file-level copyleft: used unmodified.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },        # tauri-utils -> dom_query
  { allow = ["MPL-2.0"], crate = "cssparser-macros" }, # tauri-utils -> dom_query -> cssparser
  { allow = ["MPL-2.0"], crate = "dtoa-short" },       # tauri-utils -> dom_query -> cssparser
  { allow = ["MPL-2.0"], crate = "selectors" },        # tauri-utils -> dom_query
  { allow = ["MPL-2.0"], crate = "option-ext" },       # tauri -> dirs -> dirs-sys
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" }, # Linux build: gtk sys crates -> system-deps -> cfg-expr
]

[licenses.private]
ignore = true

[bans]
# No duplicate versions of a crate without a listed exception (skip) naming what pins it.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Each skip is the older version, with the crate that pins it.
skip = [
  { crate = "base64@0.21.7", reason = "swift-rs (tauri, macOS)" },
  { crate = "bitflags@1.3.2", reason = "webkit2gtk and javascriptcore-rs (tauri, Linux gtk3 stack)" },
  { crate = "getrandom@0.3.4", reason = "tauri (uuid takes 0.4)" },
  { crate = "hashbrown@0.12.3", reason = "indexmap 1 (schemars 0.8, via tauri-utils)" },
  { crate = "heck@0.4.1", reason = "glib-macros 0.18 (tauri, Linux gtk3 stack)" },
  { crate = "indexmap@1.9.3", reason = "schemars 0.8 (via tauri-utils)" },
  { crate = "miniz_oxide@0.8.9", reason = "png (tauri icons)" },
  { crate = "proc-macro-crate@1.3.1", reason = "gtk3-macros 0.18 (tauri, Linux gtk3 stack)" },
  { crate = "proc-macro-crate@2.0.2", reason = "glib-macros 0.18 (tauri, Linux gtk3 stack)" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3 (tauri)" },
  { crate = "serde_spanned@0.6.9", reason = "toml 0.8 (system-deps, Linux build)" },
  { crate = "syn@1.0.109", reason = "proc-macro-error (gtk3-macros, Linux gtk3 stack)" },
  { crate = "syn@2.0.119", reason = "derive_more-impl, dlopen2_derive and glib-macros (via tauri)" },
  { crate = "thiserror@1.0.69", reason = "cairo-rs, gio and glib 0.18 (tauri, Linux gtk3 stack)" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 (tauri, Linux gtk3 stack)" },
  { crate = "toml@0.8.2", reason = "system-deps 6 (Linux build)" },
  { crate = "toml_datetime@0.6.3", reason = "toml 0.8 and proc-macro-crate 1 and 2 (Linux build)" },
  { crate = "toml_edit@0.19.15", reason = "proc-macro-crate 1 (gtk3-macros, Linux)" },
  { crate = "toml_edit@0.20.2", reason = "proc-macro-crate 2 and toml 0.8 (Linux)" },
  { crate = "windows-sys@0.45.0", reason = "jni (tauri, Android)" },
  { crate = "winnow@0.5.40", reason = "toml_edit 0.19 and 0.20 (Linux)" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
